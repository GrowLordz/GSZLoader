name: Build GSZ Loader APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK and cmdline-tools
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        if [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
        else
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/16.0/bin/sdkmanager"
        fi

        echo "Using sdkmanager: $SDKMANAGER"

        yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --install "cmdline-tools;latest" "platform-tools"
        yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --install "platforms;android-34" "build-tools;34.0.0"
        yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses

    - name: Gradle cache
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.5

    - name: Build Debug
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: GSZLoader-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Build Release
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: GSZLoader-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 7
